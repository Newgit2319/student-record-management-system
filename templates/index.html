<!DOCTYPE html>
<html>

<head>

<title>Student Record System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-4">Student Record Management System</h2>

<div class="card p-4 mb-4">

<h4>Add Student</h4>

<form action="/add" method="post">

<div class="row">

<div class="col">
<input type="text" name="id" class="form-control" placeholder="Student ID" required>
</div>

<div class="col">
<input type="text" name="name" class="form-control" placeholder="Student Name" required>
</div>

<div class="col">
<input type="number" name="marks" class="form-control" placeholder="Marks" required>
</div>

<div class="col">
<button class="btn btn-primary">Add</button>
</div>

</div>

</form>

</div>


<div class="card p-4 mb-4">

<h4>Search Student</h4>

<form action="/search" method="post">

<div class="row">

<div class="col">
<input type="text" name="id" class="form-control" placeholder="Enter Student ID">
</div>

<div class="col">
<button class="btn btn-success">Search</button>
</div>

</div>

</form>

</div>


<div class="card p-4">

<h4>Student List</h4>

<table class="table table-striped">

<thead>

<tr>
<th>ID</th>
<th>Name</th>
<th>Marks</th>
<th>Actions</th>
</tr>

</thead>

<tbody>

{% for s in students %}

<tr>

<td>{{ s[0] }}</td>
<td>{{ s[1] }}</td>
<td>{{ s[2] }}</td>

<td>

<a href="/delete/{{ s[0] }}" class="btn btn-danger btn-sm">Delete</a>

<form action="/update" method="post" style="display:inline;">

<input type="hidden" name="id" value="{{ s[0] }}">

<input type="number" name="marks" placeholder="New Marks" required>

<button class="btn btn-warning btn-sm">Update</button>

</form>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>

</html>
